<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutas Seguras — Rancagua</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }
  .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem; }
  .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 1.75rem; }
  .header-left .title { font-size: 22px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
  .header-left .subtitle { font-size: 13px; color: #888; margin-top: 3px; }
  .refresh-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #555; font-family: inherit; transition: background 0.15s; }
  .refresh-btn:hover { background: #f0f0f0; }
  .last-upd { font-size: 11px; color: #aaa; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .metric { background: #fff; border-radius: 10px; padding: 1rem 1.1rem; border: 1px solid #eee; }
  .metric-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .metric-value { font-size: 26px; font-weight: 600; color: #1a1a1a; }
  .metric-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 1.1rem 1.25rem; }
  .card-title { font-size: 11px; color: #999; margin-bottom: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-label { font-size: 12px; min-width: 100px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 7px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
  .bar-pct { font-size: 12px; color: #999; min-width: 32px; text-align: right; }
  .donut-wrap { display: flex; align-items: center; gap: 14px; }
  .legend { display: flex; flex-direction: column; gap: 5px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .estado { font-size: 14px; color: #888; text-align: center; padding: 3rem 0; }
  .error-box { font-size: 13px; color: #c0392b; background: #fdf0ef; border-radius: 8px; padding: 12px 16px; margin-bottom: 1rem; border: 1px solid #f5c6c2; }
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  td, th { padding: 7px 8px; border-bottom: 1px solid #f0f0f0; text-align: left; }
  th { font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 99px; display: inline-block; font-weight: 500; }
  .pill-si { background: #e8f8f0; color: #1a7a4a; }
  .pill-no { background: #fdecea; color: #c0392b; }
  .pill-parcial { background: #fff8e6; color: #a06000; }
  .section-title { font-size: 14px; font-weight: 600; color: #444; margin: 1.75rem 0 0.75rem; padding-bottom: 8px; border-bottom: 2px solid #eee; display: flex; align-items: center; gap: 6px; }
  .respuesta-item { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .respuesta-texto { font-size: 14px; color: #222; line-height: 1.5; }
  .respuesta-meta { font-size: 11px; color: #aaa; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: #f5f5f3; border: 1px solid #eee; border-radius: 99px; padding: 1px 8px; font-size: 11px; color: #666; }
  .empty-msg { font-size: 13px; color: #aaa; text-align: center; padding: 1.5rem 0; }
  @media (max-width: 600px) { .grid2, .grid3 { grid-template-columns: 1fr; } .bar-label { min-width: 70px; } }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-left">
      <div class="title"><i class="ti ti-map-2"></i> Rutas Seguras — Rancagua</div>
      <div class="subtitle">Encuesta comunitaria · datos en tiempo real</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="last-upd" id="last-upd"></span>
      <button class="refresh-btn" onclick="loadData()"><i class="ti ti-refresh" style="font-size:14px;"></i> Actualizar</button>
    </div>
  </div>

  <div id="error-area"></div>
  <div id="loading-area" class="estado"><i class="ti ti-loader" style="font-size:16px;vertical-align:-2px;margin-right:6px;"></i>Cargando datos...</div>

  <div id="dashboard" style="display:none;">
    <div class="metrics" id="metricas"></div>
    <div class="grid3" id="row1"></div>
    <div class="grid2" id="row2"></div>
    <div class="card" style="margin-bottom:12px;" id="factores-card"></div>
    <div class="grid2" id="row3"></div>
    <div class="card" style="margin-bottom:12px;" id="tabla-card"></div>
    <div class="section-title"><i class="ti ti-message-2" style="font-size:16px;"></i> Respuestas escritas por los encuestados</div>
    <div id="respuestas-abiertas"></div>
  </div>

</div>
<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQTA2guBgVhx2cvpjTNZFa48lLQA4HeU05h6af0gDsPFQWcsublCOSV0nAoJK2b5EXI56lNHVoOrTfW/pub?output=csv';
const C = { ts:0, genero:1, edad:2, comuna:3, transita:4, seguro:5, cambio:6, factores:7, secciones:8, puntos:9, rutas:10 };
const CLRS = ['#378ADD','#1D9E75','#D85A30','#BA7517','#7F77DD','#639922','#D4537E','#888780'];
let allCharts = [];

const OPCIONES_FIJAS = [
  'mujer','hombre','prefiero no decirlo','otras','otro','otra','otros',
  '15 - 20','21 - 30','31 - 40','41 - 50','51 o más',
  'rancagua','machalí','graneros','mostazal','requínoa','olivar','doñihue','codegua','coinco','quinta de tilcoco',
  'sí','no','parcialmente',
  'iluminación deficiente','sitios abandonados','poca presencia de personas','ausencia de vigilancia',
  'consumo de alcohol o drogas','acoso callejero','robos',
  'independencia','alameda',"o'carrol","o'carroll",'ocarrol'
];

function esTextoLibre(val) {
  if(!val || val.trim().length < 3) return false;
  return !OPCIONES_FIJAS.includes(val.trim().toLowerCase());
}

function parseCSV(txt) {
  return txt.split('\n').map(line => {
    const res=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;continue;}
      if(ch===','&&!inQ){res.push(cur.trim());cur='';continue;}
      cur+=ch;
    }
    res.push(cur.trim());
    return res;
  }).filter(r=>r.some(c=>c.length>0));
}

function count(arr) {
  const m={};
  arr.forEach(v=>{const k=(v||'').trim();if(k)m[k]=(m[k]||0)+1;});
  return m;
}

function multiCount(rows, col) {
  const m={};
  rows.forEach(r=>{
    (r[col]||'').split(/[,;]+/).forEach(v=>{
      const k=v.trim();if(k)m[k]=(m[k]||0)+1;
    });
  });
  return m;
}

function pct(n,t){return t?Math.round(n/t*100):0;}

function barRows(data, colors, maxItems=6) {
  const total=Object.values(data).reduce((a,b)=>a+b,0);
  return Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,maxItems).map(([k,v],i)=>`
    <div class="bar-row">
      <div class="bar-label" title="${k}">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct(v,total)}%;background:${colors[i%colors.length]};"></div></div>
      <div class="bar-pct">${pct(v,total)}%</div>
    </div>`).join('');
}

function destroyCharts(){allCharts.forEach(c=>{try{c.destroy();}catch(e){}});allCharts=[];}

function makeDonut(canvasId, data, colors) {
  setTimeout(()=>{
    const ctx=document.getElementById(canvasId);
    if(!ctx)return;
    const labels=Object.keys(data), values=Object.values(data);
    const total=values.reduce((a,b)=>a+b,0);
    const c=new Chart(ctx,{
      type:'doughnut',
      data:{labels,datasets:[{data:values,backgroundColor:colors.slice(0,labels.length),borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'68%',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw} (${pct(c.raw,total)}%)`}}}}
    });
    allCharts.push(c);
  },120);
}

async function loadData() {
  document.getElementById('error-area').innerHTML='';
  document.getElementById('loading-area').style.display='block';
  document.getElementById('loading-area').innerHTML='<i class="ti ti-loader" style="font-size:15px;vertical-align:-2px;margin-right:6px;"></i>Cargando datos...';
  document.getElementById('dashboard').style.display='none';
  try {
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error('No se pudo acceder al Sheet. Verifica que esté publicado como CSV.');
    const txt = await res.text();
    const rows = parseCSV(txt);
    if(rows.length < 2) throw new Error('El sheet no tiene respuestas aún.');
    render(rows.slice(1));
    document.getElementById('loading-area').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('last-upd').textContent='Actualizado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('loading-area').style.display='none';
    document.getElementById('error-area').innerHTML=`<div class="error-box"><i class="ti ti-alert-circle" style="font-size:14px;vertical-align:-1px;margin-right:6px;"></i>${e.message}</div>`;
  }
}

function render(data) {
  destroyCharts();
  const total=data.length;
  const generoD=count(data.map(r=>r[C.genero]));
  const edadD=count(data.map(r=>r[C.edad]));
  const transitaD=count(data.map(r=>r[C.transita]));
  const seguroD=count(data.map(r=>r[C.seguro]));
  const cambioD=count(data.map(r=>r[C.cambio]));
  const factoresD=multiCount(data,C.factores);
  const seccionesD=multiCount(data,C.secciones);
  const puntosD=count(data.map(r=>r[C.puntos]));

  const siSeguro=Object.entries(seguroD).filter(([k])=>k.toLowerCase().startsWith('s')).reduce((a,[,v])=>a+v,0);
  const siCambio=Object.entries(cambioD).filter(([k])=>k.toLowerCase().startsWith('s')).reduce((a,[,v])=>a+v,0);
  const nComunas=Object.keys(count(data.map(r=>r[C.comuna]))).length;

  document.getElementById('metricas').innerHTML=`
    <div class="metric"><div class="metric-label">Total respuestas</div><div class="metric-value">${total}</div></div>
    <div class="metric"><div class="metric-label">Se sienten seguros</div><div class="metric-value">${pct(siSeguro,total)}%</div><div class="metric-sub">${siSeguro} de ${total}</div></div>
    <div class="metric"><div class="metric-label">Cambiaron ruta</div><div class="metric-value">${pct(siCambio,total)}%</div><div class="metric-sub">${siCambio} personas</div></div>
    <div class="metric"><div class="metric-label">Comunas</div><div class="metric-value">${nComunas}</div><div class="metric-sub">distintas</div></div>
  `;

  const donutCard=(id,title,d,colors)=>`
    <div class="card">
      <div class="card-title">${title}</div>
      <div class="donut-wrap">
        <div style="position:relative;width:90px;height:90px;flex-shrink:0;"><canvas id="${id}"></canvas></div>
        <div class="legend">${Object.entries(d).map(([k,v],i)=>`<div class="legend-item"><div class="legend-dot" style="background:${colors[i%colors.length]}"></div><span>${k} — ${pct(v,total)}%</span></div>`).join('')}</div>
      </div>
    </div>`;

  document.getElementById('row1').innerHTML=
    donutCard('c-genero','Género',generoD,['#378ADD','#D85A30','#BA7517','#7F77DD'])+
    donutCard('c-edad','Edad',edadD,['#1D9E75','#7F77DD','#BA7517','#D85A30','#639922'])+
    donutCard('c-transita','¿Transita frecuentemente?',transitaD,['#1D9E75','#D85A30','#BA7517']);

  document.getElementById('row2').innerHTML=`
    <div class="card"><div class="card-title">¿Se siente seguro/a transitando solo/a?</div>${barRows(seguroD,['#1D9E75','#D85A30','#BA7517'])}</div>
    <div class="card"><div class="card-title">¿Ha cambiado rutas por inseguridad?</div>${barRows(cambioD,['#D85A30','#1D9E75','#BA7517'])}</div>
  `;

  const fTotal=Object.values(factoresD).reduce((a,b)=>a+b,0)||1;
  const fSorted=Object.entries(factoresD).sort((a,b)=>b[1]-a[1]).slice(0,8);
  document.getElementById('factores-card').innerHTML=`
    <div class="card-title">Factores que aumentan la sensación de inseguridad</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
      ${fSorted.map(([k,v],i)=>`
        <div class="bar-row">
          <div class="bar-label" title="${k}">${k}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct(v,fTotal)}%;background:${CLRS[i%CLRS.length]};"></div></div>
          <div class="bar-pct">${pct(v,fTotal)}%</div>
        </div>`).join('')}
    </div>`;

  document.getElementById('row3').innerHTML=`
    <div class="card"><div class="card-title">¿Qué secciones evita transitar?</div>${barRows(seccionesD,CLRS)}</div>
    <div class="card"><div class="card-title">¿Daría seguridad tener puntos de apoyo?</div>${barRows(puntosD,['#1D9E75','#D85A30','#BA7517'])}</div>
  `;

  const ultimas=data.slice(-5).reverse();
  document.getElementById('tabla-card').innerHTML=`
    <div class="card-title">Últimas respuestas</div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Fecha</th><th>Género</th><th>Edad</th><th>¿Seguro?</th><th>Factor principal</th></tr></thead>
        <tbody>${ultimas.map(r=>{
          const seg=(r[C.seguro]||'').toLowerCase();
          const pillCls=seg.startsWith('s')?'pill-si':seg.startsWith('p')?'pill-parcial':'pill-no';
          const fecha=(r[C.ts]||'').split(' ')[0]||'—';
          const factor=(r[C.factores]||'—').split(/[,;]/)[0].trim().slice(0,30);
          return `<tr><td style="color:#999">${fecha}</td><td>${r[C.genero]||'—'}</td><td>${r[C.edad]||'—'}</td><td><span class="pill ${pillCls}">${r[C.seguro]||'—'}</span></td><td style="color:#999">${factor}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;

  // Respuestas abiertas agrupadas por pregunta
  const grupos = [
    { label: 'Género — campo abierto', col: C.genero },
    { label: 'Comuna — campo abierto', col: C.comuna },
    { label: 'Factores de inseguridad — campo abierto', col: C.factores },
    { label: 'Secciones que evita — campo abierto', col: C.secciones },
  ];

  const raEl = document.getElementById('respuestas-abiertas');
  let html = '';
  let hayAlgo = false;

  grupos.forEach(g => {
    const items = [];
    data.forEach(r => {
      (r[g.col]||'').split(/[,;]+/).forEach(v => {
        if(esTextoLibre(v)) {
          items.push({ texto: v.trim(), fecha: (r[C.ts]||'').split(' ')[0], genero: r[C.genero]||'', edad: r[C.edad]||'' });
        }
      });
    });
    if(items.length > 0) {
      hayAlgo = true;
      html += `<div class="card" style="margin-bottom:12px;">
        <div class="card-title">${g.label} <span style="font-weight:400;color:#bbb;">(${items.length})</span></div>
        ${items.map(it=>`
          <div class="respuesta-item">
            <div class="respuesta-texto">"${it.texto}"</div>
            <div class="respuesta-meta">
              ${it.fecha?`<span class="tag">${it.fecha}</span>`:''}
              ${it.genero?`<span class="tag">${it.genero}</span>`:''}
              ${it.edad?`<span class="tag">${it.edad}</span>`:''}
            </div>
          </div>`).join('')}
      </div>`;
    }
  });

  raEl.innerHTML = hayAlgo ? html : '<div class="empty-msg">Aún no hay respuestas escritas en los campos "Otros".</div>';

  makeDonut('c-genero',generoD,['#378ADD','#D85A30','#BA7517','#7F77DD']);
  makeDonut('c-edad',edadD,['#1D9E75','#7F77DD','#BA7517','#D85A30','#639922']);
  makeDonut('c-transita',transitaD,['#1D9E75','#D85A30','#BA7517']);
}

loadData();
</script>
</body>
</html>
