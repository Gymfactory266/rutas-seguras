<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutas Seguras — Rancagua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --rojo: #C0392B;
    --rojo-oscuro: #922B21;
    --rojo-suave: #E8A89E;
    --rojo-bg: #FDF2F1;
    --rojo-mid: #D65446;
    --gris-oscuro: #1C1C1C;
    --gris-medio: #4A4A4A;
    --gris-claro: #9A9A9A;
    --gris-borde: #E8E0DF;
    --gris-fondo: #F7F3F2;
    --blanco: #FFFFFF;
    --verde: #1A6B4A;
    --verde-bg: #EAF5EF;
    --ambar: #9A6200;
    --ambar-bg: #FFF8E6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gris-fondo); color: var(--gris-oscuro); min-height: 100vh; }

  /* HERO HEADER */
  .hero {
    background: var(--rojo-oscuro);
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(255,255,255,0.015) 40px,
      rgba(255,255,255,0.015) 80px
    );
    padding: 2.5rem 0 2rem;
    margin-bottom: 2rem;
  }
  .hero-inner { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .hero-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 10px; }
  .hero-badge::before { content: ''; width: 24px; height: 1px; background: rgba(255,255,255,0.4); display: inline-block; }
  .hero-title { font-family: 'DM Serif Display', serif; font-size: 36px; color: #fff; line-height: 1.1; letter-spacing: -0.5px; }
  .hero-title span { color: var(--rojo-suave); }
  .hero-sub { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 6px; font-weight: 300; }
  .hero-right { display: flex; align-items: center; gap: 10px; }
  .last-upd { font-size: 11px; color: rgba(255,255,255,0.4); }
  .refresh-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; cursor: pointer; padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); font-family: 'DM Sans', sans-serif; letter-spacing: 0.02em; transition: all 0.15s; }
  .refresh-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.35); }

  .container { max-width: 960px; margin: 0 auto; padding: 0 1.5rem 3rem; }

  /* MÉTRICAS */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .metric { background: var(--blanco); border-radius: 12px; padding: 1.1rem 1.25rem; border: 1px solid var(--gris-borde); position: relative; overflow: hidden; }
  .metric::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--rojo); border-radius: 12px 0 0 12px; }
  .metric-label { font-size: 11px; color: var(--gris-claro); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .metric-value { font-size: 28px; font-weight: 600; color: var(--gris-oscuro); line-height: 1; }
  .metric-sub { font-size: 11px; color: var(--gris-claro); margin-top: 4px; }
  .metric.highlight::before { background: var(--rojo); }
  .metric.highlight .metric-value { color: var(--rojo); }

  /* GRID */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }

  /* CARDS */
  .card { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: 14px; padding: 1.2rem 1.4rem; }
  .card-title { font-size: 10px; color: var(--gris-claro); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }

  /* BARRAS */
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .bar-label { font-size: 12px; min-width: 110px; color: var(--gris-medio); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
  .bar-track { flex: 1; height: 6px; background: #F0ECEA; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }
  .bar-pct { font-size: 12px; color: var(--gris-claro); min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }

  /* DONUT */
  .donut-wrap { display: flex; align-items: center; gap: 14px; }
  .legend { display: flex; flex-direction: column; gap: 6px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--gris-medio); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* TABLA */
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  td, th { padding: 8px 8px; border-bottom: 1px solid #F3EDEC; text-align: left; }
  th { font-size: 10px; color: var(--gris-claro); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }
  tr:last-child td { border-bottom: none; }
  .pill { font-size: 11px; padding: 2px 10px; border-radius: 99px; display: inline-block; font-weight: 500; }
  .pill-si { background: var(--verde-bg); color: var(--verde); }
  .pill-no { background: var(--rojo-bg); color: var(--rojo); }
  .pill-parcial { background: var(--ambar-bg); color: var(--ambar); }

  /* SECCIÓN RESPUESTAS ABIERTAS */
  .section-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--gris-oscuro); margin: 2rem 0 1rem; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--gris-borde); }
  .respuesta-item { background: var(--blanco); border: 1px solid var(--gris-borde); border-left: 3px solid var(--rojo-suave); border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 8px; transition: border-left-color 0.2s; }
  .respuesta-item:hover { border-left-color: var(--rojo); }
  .respuesta-texto { font-size: 14px; color: var(--gris-oscuro); line-height: 1.55; font-style: italic; }
  .respuesta-meta { font-size: 11px; color: var(--gris-claro); margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--gris-fondo); border: 1px solid var(--gris-borde); border-radius: 99px; padding: 1px 8px; font-size: 11px; color: var(--gris-medio); font-style: normal; }

  .estado { font-size: 14px; color: var(--gris-claro); text-align: center; padding: 4rem 0; }
  .error-box { font-size: 13px; color: var(--rojo); background: var(--rojo-bg); border-radius: 10px; padding: 14px 18px; margin-bottom: 1rem; border: 1px solid #F1C0BC; display: flex; align-items: center; gap: 8px; }
  .empty-msg { font-size: 13px; color: var(--gris-claro); text-align: center; padding: 1.5rem 0; }

  @media (max-width: 640px) {
    .grid2, .grid3 { grid-template-columns: 1fr; }
    .hero-title { font-size: 26px; }
    .bar-label { min-width: 70px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="hero-badge"><i class="ti ti-map-pin" style="font-size:13px;"></i> Diagnóstico comunitario</div>
      <div class="hero-title">Rutas Seguras<br><span>Rancagua</span></div>
      <div class="hero-sub">Percepción ciudadana de seguridad en trayectos peatonales · datos en tiempo real</div>
    </div>
    <div class="hero-right">
      <span class="last-upd" id="last-upd"></span>
      <button class="refresh-btn" onclick="loadData()"><i class="ti ti-refresh" style="font-size:13px;"></i> Actualizar</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="error-area"></div>
  <div id="loading-area" class="estado"><i class="ti ti-loader" style="font-size:18px;vertical-align:-3px;margin-right:8px;color:var(--rojo);"></i>Cargando datos...</div>

  <div id="dashboard" style="display:none;">
    <div class="metrics" id="metricas"></div>
    <div class="grid3" id="row1"></div>
    <div class="grid2" id="row2"></div>
    <div class="card" style="margin-bottom:14px;" id="factores-card"></div>
    <div class="grid2" id="row3"></div>
    <div class="card" style="margin-bottom:14px;" id="tabla-card"></div>
    <div class="section-title">Respuestas escritas</div>
    <div id="respuestas-abiertas"></div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQTA2guBgVhx2cvpjTNZFa48lLQA4HeU05h6af0gDsPFQWcsublCOSV0nAoJK2b5EXI56lNHVoOrTfW/pub?output=csv';
const C = { ts:0, genero:1, edad:2, comuna:3, transita:4, seguro:5, cambio:6, factores:7, secciones:8, puntos:9, rutas:10 };
const CLRS = ['#C0392B','#D65446','#E8A89E','#922B21','#6B1F17','#E8846B','#A93226','#F0C4BE'];
const CLRS2 = ['#1A6B4A','#C0392B','#9A6200','#2E86C1','#7D3C98'];
let allCharts = [];

const OPCIONES_FIJAS = [
  'mujer','hombre','prefiero no decirlo','otras','otro','otra','otros',
  '15 - 20','21 - 30','31 - 40','41 - 50','51 o más',
  'rancagua','machalí','graneros','mostazal','requínoa','olivar','doñihue','codegua','coinco','quinta de tilcoco',
  'sí','no','parcialmente',
  'iluminación deficiente','sitios abandonados','poca presencia de personas','ausencia de vigilancia',
  'consumo de alcohol o drogas','acoso callejero','robos',
  'independencia','alameda',"o'carrol","o'carroll",'ocarrol'
];
function esTextoLibre(val) {
  if(!val||val.trim().length<3) return false;
  return !OPCIONES_FIJAS.includes(val.trim().toLowerCase());
}
function parseCSV(txt) {
  return txt.split('\n').map(line=>{
    const res=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;continue;}
      if(ch===','&&!inQ){res.push(cur.trim());cur='';continue;}
      cur+=ch;
    }
    res.push(cur.trim()); return res;
  }).filter(r=>r.some(c=>c.length>0));
}
function count(arr){const m={};arr.forEach(v=>{const k=(v||'').trim();if(k)m[k]=(m[k]||0)+1;});return m;}
function multiCount(rows,col){
  const m={};
  rows.forEach(r=>{(r[col]||'').split(/[,;]+/).forEach(v=>{const k=v.trim();if(k)m[k]=(m[k]||0)+1;});});
  return m;
}
function pct(n,t){return t?Math.round(n/t*100):0;}
function barRows(data,colors,maxItems=6){
  const total=Object.values(data).reduce((a,b)=>a+b,0);
  return Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,maxItems).map(([k,v],i)=>`
    <div class="bar-row">
      <div class="bar-label" title="${k}">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct(v,total)}%;background:${colors[i%colors.length]};"></div></div>
      <div class="bar-pct">${pct(v,total)}%</div>
    </div>`).join('');
}
function destroyCharts(){allCharts.forEach(c=>{try{c.destroy();}catch(e){}});allCharts=[];}
function makeDonut(canvasId,data,colors){
  setTimeout(()=>{
    const ctx=document.getElementById(canvasId);
    if(!ctx)return;
    const labels=Object.keys(data),values=Object.values(data);
    const total=values.reduce((a,b)=>a+b,0);
    const c=new Chart(ctx,{
      type:'doughnut',
      data:{labels,datasets:[{data:values,backgroundColor:colors.slice(0,labels.length),borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'70%',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw} (${pct(c.raw,total)}%)`}}}}
    });
    allCharts.push(c);
  },120);
}
async function loadData(){
  document.getElementById('error-area').innerHTML='';
  document.getElementById('loading-area').style.display='block';
  document.getElementById('dashboard').style.display='none';
  try{
    const res=await fetch(CSV_URL);
    if(!res.ok) throw new Error('No se pudo acceder al Sheet.');
    const txt=await res.text();
    const rows=parseCSV(txt);
    if(rows.length<2) throw new Error('Sin respuestas aún.');
    render(rows.slice(1));
    document.getElementById('loading-area').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('last-upd').textContent='Actualizado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('loading-area').style.display='none';
    document.getElementById('error-area').innerHTML=`<div class="error-box"><i class="ti ti-alert-circle" style="font-size:16px;"></i>${e.message}</div>`;
  }
}
function render(data){
  destroyCharts();
  const total=data.length;
  const generoD=count(data.map(r=>r[C.genero]));
  const edadD=count(data.map(r=>r[C.edad]));
  const transitaD=count(data.map(r=>r[C.transita]));
  const seguroD=count(data.map(r=>r[C.seguro]));
  const cambioD=count(data.map(r=>r[C.cambio]));
  const factoresD=multiCount(data,C.factores);
  const seccionesD=multiCount(data,C.secciones);
  const puntosD=count(data.map(r=>r[C.puntos]));

  const siSeguro=Object.entries(seguroD).filter(([k])=>k.toLowerCase().startsWith('s')).reduce((a,[,v])=>a+v,0);
  const siCambio=Object.entries(cambioD).filter(([k])=>k.toLowerCase().startsWith('s')).reduce((a,[,v])=>a+v,0);
  const nComunas=Object.keys(count(data.map(r=>r[C.comuna]))).length;

  document.getElementById('metricas').innerHTML=`
    <div class="metric"><div class="metric-label">Total respuestas</div><div class="metric-value">${total}</div></div>
    <div class="metric highlight"><div class="metric-label">Se sienten inseguros</div><div class="metric-value">${pct(total-siSeguro,total)}%</div><div class="metric-sub">${total-siSeguro} de ${total}</div></div>
    <div class="metric highlight"><div class="metric-label">Cambiaron ruta</div><div class="metric-value">${pct(siCambio,total)}%</div><div class="metric-sub">${siCambio} personas</div></div>
    <div class="metric"><div class="metric-label">Comunas</div><div class="metric-value">${nComunas}</div><div class="metric-sub">distintas</div></div>
  `;

  const donutCard=(id,title,d,colors)=>`
    <div class="card">
      <div class="card-title">${title}</div>
      <div class="donut-wrap">
        <div style="position:relative;width:88px;height:88px;flex-shrink:0;"><canvas id="${id}"></canvas></div>
        <div class="legend">${Object.entries(d).map(([k,v],i)=>`<div class="legend-item"><div class="legend-dot" style="background:${colors[i%colors.length]}"></div><span>${k} — ${pct(v,total)}%</span></div>`).join('')}</div>
      </div>
    </div>`;

  document.getElementById('row1').innerHTML=
    donutCard('c-genero','Género',generoD,['#C0392B','#D65446','#E8A89E','#922B21'])+
    donutCard('c-edad','Edad',edadD,['#922B21','#C0392B','#D65446','#E8A89E','#6B1F17'])+
    donutCard('c-transita','¿Transita frecuentemente?',transitaD,['#1A6B4A','#C0392B','#9A6200']);

  document.getElementById('row2').innerHTML=`
    <div class="card"><div class="card-title">¿Se siente seguro/a transitando solo/a?</div>${barRows(seguroD,['#1A6B4A','#C0392B','#9A6200'])}</div>
    <div class="card"><div class="card-title">¿Ha cambiado rutas por inseguridad?</div>${barRows(cambioD,['#C0392B','#1A6B4A','#9A6200'])}</div>
  `;

  const fTotal=Object.values(factoresD).reduce((a,b)=>a+b,0)||1;
  const fSorted=Object.entries(factoresD).sort((a,b)=>b[1]-a[1]).slice(0,8);
  document.getElementById('factores-card').innerHTML=`
    <div class="card-title">Factores que aumentan la sensación de inseguridad</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 24px;">
      ${fSorted.map(([k,v],i)=>`
        <div class="bar-row">
          <div class="bar-label" title="${k}">${k}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct(v,fTotal)}%;background:${CLRS[i%CLRS.length]};"></div></div>
          <div class="bar-pct">${pct(v,fTotal)}%</div>
        </div>`).join('')}
    </div>`;

  document.getElementById('row3').innerHTML=`
    <div class="card"><div class="card-title">¿Qué secciones evita transitar?</div>${barRows(seccionesD,CLRS)}</div>
    <div class="card"><div class="card-title">¿Daría seguridad tener puntos de apoyo?</div>${barRows(puntosD,['#1A6B4A','#C0392B'])}</div>
  `;

  const ultimas=data.slice(-5).reverse();
  document.getElementById('tabla-card').innerHTML=`
    <div class="card-title">Últimas respuestas</div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Fecha</th><th>Género</th><th>Edad</th><th>¿Seguro?</th><th>Factor principal</th></tr></thead>
        <tbody>${ultimas.map(r=>{
          const seg=(r[C.seguro]||'').toLowerCase();
          const pillCls=seg.startsWith('s')?'pill-si':seg.startsWith('p')?'pill-parcial':'pill-no';
          const fecha=(r[C.ts]||'').split(' ')[0]||'—';
          const factor=(r[C.factores]||'—').split(/[,;]/)[0].trim().slice(0,30);
          return `<tr><td style="color:var(--gris-claro)">${fecha}</td><td>${r[C.genero]||'—'}</td><td>${r[C.edad]||'—'}</td><td><span class="pill ${pillCls}">${r[C.seguro]||'—'}</span></td><td style="color:var(--gris-claro)">${factor}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;

  // Respuestas abiertas
  const grupos=[
    {label:'Género — campo abierto',col:C.genero},
    {label:'Comuna — campo abierto',col:C.comuna},
    {label:'Factores de inseguridad — campo abierto',col:C.factores},
    {label:'Secciones que evita — campo abierto',col:C.secciones},
  ];
  const raEl=document.getElementById('respuestas-abiertas');
  let html=''; let hayAlgo=false;
  grupos.forEach(g=>{
    const items=[];
    data.forEach(r=>{
      (r[g.col]||'').split(/[,;]+/).forEach(v=>{
        if(esTextoLibre(v)) items.push({texto:v.trim(),fecha:(r[C.ts]||'').split(' ')[0],genero:r[C.genero]||'',edad:r[C.edad]||''});
      });
    });
    if(items.length>0){
      hayAlgo=true;
      html+=`<div class="card" style="margin-bottom:12px;">
        <div class="card-title">${g.label} <span style="font-weight:400;color:#ccc;">(${items.length})</span></div>
        ${items.map(it=>`
          <div class="respuesta-item">
            <div class="respuesta-texto">"${it.texto}"</div>
            <div class="respuesta-meta">
              ${it.fecha?`<span class="tag">${it.fecha}</span>`:''}
              ${it.genero?`<span class="tag">${it.genero}</span>`:''}
              ${it.edad?`<span class="tag">${it.edad}</span>`:''}
            </div>
          </div>`).join('')}
      </div>`;
    }
  });
  raEl.innerHTML=hayAlgo?html:'<div class="empty-msg">Aún no hay respuestas escritas en los campos "Otros".</div>';

  makeDonut('c-genero',generoD,['#C0392B','#D65446','#E8A89E','#922B21']);
  makeDonut('c-edad',edadD,['#922B21','#C0392B','#D65446','#E8A89E','#6B1F17']);
  makeDonut('c-transita',transitaD,['#1A6B4A','#C0392B','#9A6200']);
}
loadData();
</script>
</body>
</html>
